<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Book a Free Consultation | Optimum Laser</title>
  <style>
    html, body { height: 100%; }
    body { margin: 0; min-height: 100dvh; overflow: hidden; display: flex; flex-direction: column; background: #fbf6ef; color: #35281e; font-family: Arial, sans-serif; }
    header { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 14px; padding: 8px 16px; text-align: left; }
    .brand { display: inline-block; flex: 0 0 auto; line-height: 0; }
    .brand img { display: block; width: clamp(112px, 18vw, 162px); height: auto; }
    .heading { min-width: 0; }
    h1 { margin: 0; font-family: Georgia, serif; font-size: clamp(1.15rem, 2.6vw, 1.6rem); line-height: 1.1; }
    p { margin: 3px 0 0; color: #5b4638; font-size: clamp(.78rem, 1.8vw, .95rem); }
    #booking { box-sizing: border-box; display: flex; flex: 1 1 auto; min-height: 0; width: min(700px, 100%); margin: 0 auto; padding: 0 12px 12px; }
    #externalBookingPluginContainer { box-sizing: border-box !important; flex: 1 1 auto; width: 100% !important; height: 100% !important; min-height: 0 !important; max-height: 100% !important; overflow: hidden !important; border: 1px solid #eadbc9; border-radius: 14px; box-shadow: 0 8px 24px rgba(53, 40, 30, .09); }
    #externalBookingPlugin { display: block; box-sizing: border-box; width: 100% !important; height: 100% !important; min-height: 0 !important; max-height: 100% !important; border: 0; }
    @media (max-width: 480px) {
      header { gap: 10px; padding: 7px 12px; }
      .brand img { width: 104px; }
      p { display: none; }
      #booking { padding: 0 8px 8px; }
      #externalBookingPluginContainer { border-radius: 10px; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/" aria-label="Optimum Laser home">
      <img src="/images/homepage/Optimum%20Laser%20Brown%20Logo.png" alt="Optimum Laser" />
    </a>
    <div class="heading">
      <h1>Book a Free Consultation</h1>
      <p>Choose a time that works for you.</p>
    </div>
  </header>
  <div id="booking">
    <script type="text/javascript">
      var daysmart_acc = "dc3faad1-130b-4594-9fd0-27c386264ba3";
      var daysmart_iframe_width = 700;
      var daysmart_iframe_height = 0;
      var daysmart_website_root = "https://plugin.myonlineappointment.com";
      var load_in_iframe = "false";
    </script>
    <script type="text/javascript" src="https://plugin.myonlineappointment.com/Scripts/external/bookingplugin.js"></script>
  </div>
</body>
</html>
